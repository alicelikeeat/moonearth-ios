name: MoonEarth
options:
  bundleIdPrefix: com.moonearth
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: NO
targets:
  MoonEarth:
    type: application
    platform: iOS
    sources:
      - path: MoonEarth
    info:
      path: MoonEarth/Info.plist
      properties:
        CFBundleDisplayName: Moon Earth
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.moonearth.world
            UTTypeDescription: Moon Earth World
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [pxworld]
          - UTTypeIdentifier: com.moonearth.region
            UTTypeDescription: Moon Earth Region
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [pxregion]
          - UTTypeIdentifier: com.moonearth.building
            UTTypeDescription: Moon Earth Building
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [pxbuilding]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Moon Earth Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.moonearth.world, com.moonearth.region, com.moonearth.building]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moonearth.studio
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  MoonEarth:
    build:
      targets:
        MoonEarth: all
    run:
      config: Debug
    archive:
      config: Release
